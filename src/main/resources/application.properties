spring.application.name=api

# ==============================
# rabbitmq
# ==============================
spring.rabbitmq.addresses=${RABBITMQ_URL}
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=2s


# ==============================
# redis
# ==============================
spring.data.redis.url=${REDIS_URL}


# ==============================
# cloudflare
# ==============================
cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.access-key=${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-key=${R2_SECRET_ACCESS_KEY}
cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com

# ==============================
# PostgreSQL
# ==============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ==============================
# EMAIL / GMAIL
# ==============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true